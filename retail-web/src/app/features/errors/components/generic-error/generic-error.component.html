<cn-page-header title="Something went wrong" i18n-title="@@errors.genericError.title"></cn-page-header>

<div class="mol-page mol-prose" fxLayout="column" fxLayoutGap="12px">
  <p i18n="@@errors.genericError.p1">We hit a problem loading this page. Nothing has changed on your accounts. Try again in a moment; if it keeps happening, call us and quote the reference on this page.</p>

  <cn-button variant="primary" routerLink="/dashboard" i18n="@@errors.genericError.retry">Try again</cn-button>
</div>
