<cn-page-header title="How to reach you" i18n-title="@@onboarding.contactStep.title" [backLink]="'/open-account/identity'"></cn-page-header>

<form class="mol-page mol-form" [formGroup]="form" (ngSubmit)="submit()" novalidate fxLayout="column" fxLayoutGap="16px">
  <cn-error-summary [form]="form" *ngIf="submitted && form.invalid"></cn-error-summary>
  <mol-error-banner [error]="error" [showRetry]="false"></mol-error-banner>

  <cn-card [padded]="true">
    <div fxLayout="row" fxLayout.lt-md="column" fxLayoutGap="16px">
      <mat-form-field appearance="outline" fxFlex>
        <mat-label i18n="@@onboarding.contact.email">Email</mat-label>
        <input matInput formControlName="email" molTrimOnBlur maxlength="120" autocomplete="email">
        <mat-error *ngIf="form.get('email')?.hasError('required')" i18n="@@validation.required">This field is required</mat-error>
      </mat-form-field>
      <cn-masked-input formControlName="mobile" i18n-label="@@onboarding.contact.mobile" label="Mobile number" preset="phone" [required]="true" fxFlex></cn-masked-input>
    </div>
    <div fxLayout="row" fxLayout.lt-md="column" fxLayoutGap="16px">
      <mat-form-field appearance="outline" fxFlex>
        <mat-label i18n="@@onboarding.contact.line1">Street address</mat-label>
        <input matInput formControlName="line1" molTrimOnBlur maxlength="80" autocomplete="address-line1">
        <mat-error *ngIf="form.get('line1')?.hasError('required')" i18n="@@validation.required">This field is required</mat-error>
      </mat-form-field>
      <mat-form-field appearance="outline" fxFlex>
        <mat-label i18n="@@onboarding.contact.city">City</mat-label>
        <input matInput formControlName="city" molTrimOnBlur maxlength="60" >
        <mat-error *ngIf="form.get('city')?.hasError('required')" i18n="@@validation.required">This field is required</mat-error>
      </mat-form-field>
    </div>
    <div fxLayout="row" fxLayout.lt-md="column" fxLayoutGap="16px">
      <mat-form-field appearance="outline" fxFlex>
        <mat-label i18n="@@onboarding.contact.state">State</mat-label>
        <input matInput formControlName="state" molTrimOnBlur maxlength="2" >
        <mat-error *ngIf="form.get('state')?.hasError('required')" i18n="@@validation.required">This field is required</mat-error>
      </mat-form-field>
      <mat-form-field appearance="outline" fxFlex>
        <mat-label i18n="@@onboarding.contact.zip">ZIP code</mat-label>
        <input matInput formControlName="postalCode" molTrimOnBlur maxlength="10" autocomplete="postal-code">
        <mat-error *ngIf="form.get('postalCode')?.hasError('required')" i18n="@@validation.required">This field is required</mat-error>
      </mat-form-field>
    </div>
  </cn-card>

  <div fxLayout="row" fxLayout.lt-md="column" fxLayoutGap="8px" fxLayoutAlign="end">
    <cn-button variant="tertiary" type="button" (pressed)="cancel()" i18n="@@action.cancel">Cancel</cn-button>
    <cn-button variant="primary" type="submit" [loading]="saving" i18n="@@onboarding.contactStep.submit">Continue</cn-button>
  </div>
</form>
