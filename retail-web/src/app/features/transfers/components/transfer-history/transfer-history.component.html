<cn-page-header title="Transfer history" i18n-title="@@transfers.transferHistory.title" lede="Up to 24 months of transfers. Older activity is on your statements." i18n-lede="@@transfers.transferHistory.lede"></cn-page-header>

<div class="mol-page" fxLayout="column" fxLayoutGap="16px">
  <mol-error-banner [error]="error$ | async" (retry)="reload()"></mol-error-banner>

  <mol-page-section title="Transfer history" i18n-title="@@transfers.transferHistory.section">
    <ng-container *ngIf="loading$ | async; else table">
      <mol-loading-panel [rows]="6"></mol-loading-panel>
    </ng-container>
    <ng-template #table>
      <cn-data-table *ngIf="(rows$ | async)?.length; else empty" [columns]="columns" [rows]="(rows$ | async) ?? []"
        caption="Transfer history" i18n-caption="@@transfers.transferHistory.caption" [pageSize]="25" [showPaginator]="true" (rowClick)="open($event)"></cn-data-table>
    </ng-template>
    <ng-template #empty>
      <mol-empty-state icon="history" title="No transfers yet" i18n-title="@@transfers.transferHistory.empty"
        body="" i18n-body="@@transfers.transferHistory.emptyBody"></mol-empty-state>
    </ng-template>
  </mol-page-section>
</div>
