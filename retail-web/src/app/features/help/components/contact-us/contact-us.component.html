<cn-page-header title="Contact us" i18n-title="@@help.contactUs.title" [backLink]="'/help'"></cn-page-header>

<div class="mol-page mol-prose" fxLayout="column" fxLayoutGap="12px">
  <p i18n="@@help.contactUs.p1">Customer care: 1-800-555-0100, 7am-10pm ET every day.</p>
  <p i18n="@@help.contactUs.p2">Lost or stolen cards: 1-800-555-0199, 24 hours.</p>
  <p i18n="@@help.contactUs.p3">Hearing or speech impaired: dial 711 then the number above.</p>

  <cn-button variant="primary" routerLink="/messages/new" i18n="@@help.contactUs.message">Send a secure message</cn-button>
</div>
