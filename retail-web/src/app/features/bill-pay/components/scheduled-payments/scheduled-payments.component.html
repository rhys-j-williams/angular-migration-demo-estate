<cn-page-header title="Scheduled payments" i18n-title="@@billPay.scheduledPayments.title"></cn-page-header>

<div class="mol-page" fxLayout="column" fxLayoutGap="16px">
  <mol-error-banner [error]="error$ | async" (retry)="reload()"></mol-error-banner>

  <mol-page-section title="Scheduled payments" i18n-title="@@billPay.scheduledPayments.section">
    <ng-container *ngIf="loading$ | async; else table">
      <mol-loading-panel [rows]="6"></mol-loading-panel>
    </ng-container>
    <ng-template #table>
      <cn-data-table *ngIf="(rows$ | async)?.length; else empty" [columns]="columns" [rows]="(rows$ | async) ?? []"
        caption="Scheduled payments" i18n-caption="@@billPay.scheduledPayments.caption" [pageSize]="25" [showPaginator]="true" (rowClick)="open($event)"></cn-data-table>
    </ng-template>
    <ng-template #empty>
      <mol-empty-state icon="event" title="No scheduled payments" i18n-title="@@billPay.scheduledPayments.empty"
        body="" i18n-body="@@billPay.scheduledPayments.emptyBody"></mol-empty-state>
    </ng-template>
  </mol-page-section>
</div>
