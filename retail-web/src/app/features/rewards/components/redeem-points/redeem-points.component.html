<cn-page-header title="Redeem points" i18n-title="@@rewards.redeemPoints.title" lede="Statement credits post within 2 business days. Deposits to a Meridian account are same day." i18n-lede="@@rewards.redeemPoints.lede" [backLink]="'/rewards'"></cn-page-header>

<form class="mol-page mol-form" [formGroup]="form" (ngSubmit)="submit()" novalidate fxLayout="column" fxLayoutGap="16px">
  <cn-error-summary [form]="form" *ngIf="submitted && form.invalid"></cn-error-summary>
  <mol-error-banner [error]="error" [showRetry]="false"></mol-error-banner>

  <cn-card [padded]="true">
    <div fxLayout="row" fxLayout.lt-md="column" fxLayoutGap="16px">
      <cn-select formControlName="optionId" i18n-label="@@rewards.redeem.option" label="Redeem for" [options]="optionIdOptions" [required]="true" fxFlex></cn-select>
      <mat-form-field appearance="outline" fxFlex>
        <mat-label i18n="@@rewards.redeem.points">Points to redeem</mat-label>
        <input matInput formControlName="points" molTrimOnBlur maxlength="7" >
        <mat-error *ngIf="form.get('points')?.hasError('required')" i18n="@@validation.required">This field is required</mat-error>
      </mat-form-field>
    </div>
  </cn-card>

  <div fxLayout="row" fxLayout.lt-md="column" fxLayoutGap="8px" fxLayoutAlign="end">
    <cn-button variant="tertiary" type="button" (pressed)="cancel()" i18n="@@action.cancel">Cancel</cn-button>
    <cn-button variant="primary" type="submit" [loading]="saving" i18n="@@rewards.redeemPoints.submit">Redeem</cn-button>
  </div>
</form>
