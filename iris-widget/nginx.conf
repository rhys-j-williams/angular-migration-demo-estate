# Sandbox only. Serves the harness page at / and the bundle under /assets/widgets/ exactly as
# retail-web does, so "works in the sandbox" means something.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  access_log /dev/stdout;
  sendfile on;
  server {
    listen 8080;
    root /usr/share/nginx/html;
    # Hashed bundle: cache forever. Stable name and manifest: do not cache, that is the whole point of them.
    location ~ ^/assets/widgets/main\.[0-9a-f]+\.js$ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location = /assets/widgets/iris.js { add_header Cache-Control "no-cache"; }
    location = /assets/widgets/iris.manifest.json { add_header Cache-Control "no-cache"; }
    location / { try_files $uri /index.html; }
  }
}
