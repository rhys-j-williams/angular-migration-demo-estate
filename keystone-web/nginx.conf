# keystone-web nginx. Unprivileged UBI nginx, 8080. Derived from platform-tooling/docker/nginx/nginx.conf
# at TOOL-0388 and then hand-edited; the shared template's CSP allows 'unsafe-inline' on style-src,
# this one does not and must not (GIS-STD-014 tier 1, KEY-1840). The header below duplicates the
# meta tag in index.html on purpose: the meta tag covers the page if a proxy strips headers, the
# header covers the assets. Change both or neither.
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format json escape=json '{"time":"$time_iso8601","status":$status,"method":"$request_method",'
    '"uri":"$uri","bytes":$body_bytes_sent,"referer":"$http_referer","correlationId":"$http_x_correlation_id"}';
  access_log /dev/stdout json;
  sendfile on;
  server_tokens off;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  server {
    listen 8080;
    root /opt/app-root/src;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Cache-Control "no-store" always;
    # connect-src is per environment; the chart templates it into CSP_CONNECT_SRC and the
    # entrypoint substitutes it. Default here is prod. No 'unsafe-inline'. No 'unsafe-eval'.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://login.meridiantrust.example https://api.meridiantrust.example; frame-ancestors 'none'; form-action 'self' https://login.meridiantrust.example; base-uri 'self'; object-src 'none'" always;

    location = /health {
      access_log off;
      return 200 'ok';
      add_header Content-Type text/plain;
    }

    location ~* \.(js|css|svg|woff2?)$ {
      expires 1y;
      add_header Cache-Control "public, immutable" always;
      add_header X-Content-Type-Options nosniff always;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
