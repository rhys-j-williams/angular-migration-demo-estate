apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "keystone-web.name" . }}
  labels:
    {{- include "keystone-web.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "keystone-web.name" . }}
  template:
    metadata:
      labels:
        {{- include "keystone-web.labels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: nginx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: CSP_CONNECT_SRC
              value: {{ join " " .Values.cspConnectSrc | quote }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # nginx temp paths under /tmp; TODO(KEY-1993) emptyDir
            capabilities:
              drop: ["ALL"]
