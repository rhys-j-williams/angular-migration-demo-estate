apiVersion: v1
kind: Service
metadata:
  name: {{ include "keystone-web.name" . }}
  labels:
    {{- include "keystone-web.labels" . | nindent 4 }}
spec:
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/name: {{ include "keystone-web.name" . }}
