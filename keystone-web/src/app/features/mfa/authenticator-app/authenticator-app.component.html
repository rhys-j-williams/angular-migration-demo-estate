<section class="ks-card" aria-labelledby="ks-totp-title" style="position: relative" *ngIf="txn">
  <ks-busy-overlay [busy]="busy" label="Checking your code"></ks-busy-overlay>
  <h1 id="ks-totp-title" class="ks-card__title">Enter the code from your authenticator app</h1>
  <p class="ks-card__lede">Open your authenticator app and enter the 6 digit code shown for Meridian Trust Bank.</p>
  <p *ngIf="error" class="ks-error-text" role="alert">{{ error }}</p>

  <ks-otp-input [formControl]="code" [invalid]="!!error" ariaLabel="Authenticator code" (completed)="submit($event)"></ks-otp-input>

  <div class="ks-actions">
    <button mat-raised-button color="primary" type="button" (click)="submit()" [disabled]="busy">Continue</button>
    <button mat-button type="button" (click)="changeChannel()">Verify a different way</button>
  </div>
</section>
