<ks-rate-limit-banner></ks-rate-limit-banner>

<section class="ks-card ks-otp-challenge" aria-labelledby="ks-otp-title" *ngIf="txn">
  <ks-busy-overlay [busy]="busy" label="Checking your code"></ks-busy-overlay>

  <h1 id="ks-otp-title" class="ks-card__title">Enter your code</h1>
  <p class="ks-card__lede">We sent a 6 digit code to {{ destinationLabel }}.</p>

  <p *ngIf="error" class="ks-error-text" role="alert">{{ error }}</p>
  <p *ngIf="resent && !error" class="ks-otp-challenge__resent" role="status">We sent a new code.</p>

  <ks-otp-input [formControl]="code" [invalid]="!!error" (completed)="submit($event)"></ks-otp-input>

  <mat-checkbox [formControl]="trustDevice" class="ks-otp-challenge__trust">
    Don't ask for a code on this device for {{ 30 }} days
  </mat-checkbox>

  <div class="ks-actions">
    <button mat-raised-button color="primary" type="button" (click)="submit()" [disabled]="busy">Continue</button>
    <button mat-button type="button" (click)="resend()" [disabled]="resendIn > 0">
      {{ resendIn > 0 ? 'Resend code in ' + resendIn + 's' : 'Resend code' }}
    </button>
    <button mat-button type="button" (click)="changeChannel()">Get the code a different way</button>
  </div>
</section>
