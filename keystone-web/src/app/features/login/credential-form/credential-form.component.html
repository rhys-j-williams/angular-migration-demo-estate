<form [formGroup]="form" (ngSubmit)="submit()" novalidate autocomplete="on" class="ks-cred">
  <p *ngIf="error" class="ks-error-text" role="alert" id="ks-cred-error">{{ error }}</p>

  <mat-form-field appearance="outline" class="ks-form-row ks-legacy-nudge">
    <mat-label>Username</mat-label>
    <input
      matInput
      formControlName="username"
      type="text"
      autocomplete="username"
      autocapitalize="none"
      spellcheck="false"
      inputmode="email"
      maxlength="64"
      autofocus
      [attr.aria-describedby]="error ? 'ks-cred-error' : null" />
    <mat-error *ngIf="usernameError">{{ usernameError }}</mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline" class="ks-form-row ks-legacy-nudge">
    <mat-label>Password</mat-label>
    <input
      matInput
      formControlName="password"
      [type]="showPassword ? 'text' : 'password'"
      autocomplete="current-password"
      maxlength="128" />
    <button
      mat-icon-button
      matSuffix
      type="button"
      (click)="toggleShowPassword()"
      [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
      [attr.aria-pressed]="showPassword">
      <mat-icon [svgIcon]="showPassword ? 'cn:eye-off' : 'cn:eye'"></mat-icon>
    </button>
    <mat-error *ngIf="form.controls.password.touched && form.controls.password.invalid">Enter your password</mat-error>
  </mat-form-field>

  <mat-checkbox formControlName="rememberUsername" class="ks-cred__remember">Remember my username</mat-checkbox>

  <div class="ks-actions">
    <button mat-raised-button color="primary" type="submit" class="ks-cred__submit" [disabled]="disabled">Sign in</button>
  </div>
</form>
