<mat-checkbox class="cn-checkbox__control" color="primary" [checked]="checked" [indeterminate]="indeterminate"
              [disabled]="disabled" [required]="required" [labelPosition]="labelPosition"
              [attr.aria-label]="ariaLabel" (change)="onMatChange($event)">
  <span class="cn-checkbox__label"><ng-content></ng-content></span>
  <span class="cn-checkbox__hint" *ngIf="hint">{{ hint }}</span>
</mat-checkbox>
