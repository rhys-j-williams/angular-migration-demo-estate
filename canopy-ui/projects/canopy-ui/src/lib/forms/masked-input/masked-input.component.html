<mat-form-field [appearance]="appearance" class="cn-masked-input__field">
  <mat-label *ngIf="label">{{ label }}</mat-label>
  <input matInput type="text" [attr.inputmode]="inputMode" autocomplete="off"
         [mask]="activeMask" [dropSpecialCharacters]="true" [showMaskTyped]="false"
         [ngModel]="value" (ngModelChange)="onModelChange($event)" (blur)="onBlur()"
         [placeholder]="placeholder" [disabled]="disabled" [required]="required"
         [attr.aria-invalid]="!!errorText" />
  <mat-hint *ngIf="hint && !errorText">{{ hint }}</mat-hint>
  <mat-error *ngIf="errorText">{{ errorText }}</mat-error>
</mat-form-field>
