<ng-container [ngSwitch]="shape">
  <ng-container *ngSwitchCase="'text'">
    <span *ngFor="let line of lineArray; let last = last" class="cn-skeleton__bone cn-skeleton__bone--text"
          [style.width]="width || (last && lineArray.length > 1 ? '60%' : '100%')"></span>
  </ng-container>
  <span *ngSwitchCase="'heading'" class="cn-skeleton__bone cn-skeleton__bone--heading" [style.width]="width || '40%'"></span>
  <span *ngSwitchCase="'circle'" class="cn-skeleton__bone cn-skeleton__bone--circle" [style.width]="width || '40px'" [style.height]="height || width || '40px'"></span>
  <span *ngSwitchCase="'rect'" class="cn-skeleton__bone cn-skeleton__bone--rect" [style.width]="width || '100%'" [style.height]="height || '120px'"></span>
  <div *ngSwitchCase="'card'" class="cn-skeleton__card">
    <span class="cn-skeleton__bone cn-skeleton__bone--heading" style="width: 50%"></span>
    <span class="cn-skeleton__bone cn-skeleton__bone--text" style="width: 30%"></span>
    <span class="cn-skeleton__bone cn-skeleton__bone--amount"></span>
  </div>
  <div *ngSwitchCase="'row'" class="cn-skeleton__row" [style.height]="height || '52px'">
    <span class="cn-skeleton__bone cn-skeleton__bone--text" style="width: 20%"></span>
    <span class="cn-skeleton__bone cn-skeleton__bone--text" style="width: 45%"></span>
    <span class="cn-skeleton__bone cn-skeleton__bone--text" style="width: 15%"></span>
  </div>
</ng-container>
<span class="cdk-visually-hidden">{{ label }}</span>
